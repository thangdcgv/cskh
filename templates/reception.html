{% extends "base.html" %}
{% block title %}Lễ Tân Tiếp Nhận & Quản Lý Đơn | Center Hub{% endblock %}

{% block head %}
{{ super() }}
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

.kanban-container {
  display: flex;
  overflow: auto;
  gap: 1.25rem;
  padding-bottom: 1rem;
  height: 100%;
}
</style>
{% endblock %}

{% block content %}
<div id="root" class="w-full h-full"></div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
  window.SUPABASE_URL = "{{ supabase_url or '' }}";
  window.SUPABASE_ANON_KEY = "{{ supabase_anon_key or '' }}";
  window.SUPABASE_KEY = window.SUPABASE_ANON_KEY;
  window.CURRENT_USER = {
    role: "{{ current_user.role or session.get('role', 'admin') }}",
    username: "{{ current_user.username or session.get('username', '') }}"
  };
</script>

{% raw %}
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API_BASE = "/api/reception";

const WORKFLOWS = [
  { id: 'repair', name: 'Sửa Chữa - Bảo Hành', icon: 'fa-screwdriver-wrench' },
  { id: 'storage', name: 'Lưu Kho Công Ty', icon: 'fa-warehouse' },
  { id: 'delivery', name: 'Giao Nhận Hàng', icon: 'fa-truck-fast' },
  { id: 'all', name: 'Tất Cả Đơn Hàng', icon: 'fa-layer-group' }
];

const getSupabaseClient = () => {
  if (window._supabaseInstance) return window._supabaseInstance;
  const url = window.SUPABASE_URL || '';
  const key = window.SUPABASE_ANON_KEY || window.SUPABASE_KEY || '';
  if (url && key && window.supabase) {
    window._supabaseInstance = window.supabase.createClient(url, key);
    return window._supabaseInstance;
  }
  return null;
};

const handleResponse = async (res) => {
  if (res.status === 401) {
    window.location.href = '/login';
    throw new Error('Vui lòng đăng nhập lại');
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || data.message || 'Yêu cầu thất bại');
  return data;
};

const removeAccents = (str) => {
  if (!str) return '';
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
};

const sendReceptionSms = (record, hotline = '', trackingDomain = '') => {
  if (!record || !record.phone) return;
  const cleanPhone = record.phone.replace(/[\s\-\.]/g, '');
  const nowStr = new Date(record.created_at || Date.now()).toLocaleDateString('vi-VN');
  const cleanCustomerName = removeAccents(record.customer_name || '');
  const noteStr = removeAccents(record.received_note || record.note || 'Binh thuong').trim();
  
  const domain = trackingDomain || 'cskh-nu.vercel.app/tracking';
  const lhPart = hotline ? `. LH: ${hotline}` : '';
  const smsText = (
    `May in Dai Thanh tao phieu [${record.code}] ghi nhan thiet bi KH ${cleanCustomerName} ` +
    `luc ${nowStr}. Tinh trang: ${noteStr}. ` +
    `Tra cuu: ${domain}/tracking/${cleanPhone}${lhPart}`
  );
  
  const encodedText = encodeURIComponent(smsText);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const targetLink = isIOS 
    ? `sms:${cleanPhone}&body=${encodedText}` 
    : `sms:${cleanPhone}?body=${encodedText}`;
  window.location.href = targetLink;
};

function ReceptionApp() {
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);

  const [searchQuery, setSearchQuery] = useState('');
  const [records, setRecords] = useState([]);
  const [hotlinePhone, setHotlinePhone] = useState('');
  const [activeWorkflow, setActiveWorkflow] = useState('repair'); 
  const [isSidebarOpen, setIsSidebarOpen] = useState(true);

  const [editingRecord, setEditingRecord] = useState(null);
  const [editForm, setEditForm] = useState({ customer_name: '', phone: '', address: '', note: '', received_note: '' });
  const [isSaving, setIsSaving] = useState(false);

  const [returnModalRecord, setReturnModalRecord] = useState(null);
  const [returnForm, setReturnForm] = useState({ returned_method: 'Trực tiếp tại cửa hàng', returned_note: '' });
  const [isSubmittingReturn, setIsSubmittingReturn] = useState(false);

  // STATE DÀNH RIÊNG CHO MODAL XÓA CẨN THẬN
  const [deleteModalRecord, setDeleteModalRecord] = useState(null);
  const [isDeleting, setIsDeleting] = useState(false);

  const currentUser = window.CURRENT_USER || { role: 'admin', username: '' };

  const showToast = (message, type = 'success') => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ message, type });
    toastTimerRef.current = setTimeout(() => setToast(null), 5000);
  };

  useEffect(() => {
    const fetchHotline = async () => {
      try {
        const res = await fetch('/api/settings/config');
        if (res.ok) {
          const config = await res.json();
          if (config && config.sms_hotline) setHotlinePhone(config.sms_hotline.trim());
        }
      } catch (err) {}
    };
    fetchHotline();
  }, []);

  const handleSearch = useCallback(async (queryStr) => {
    try {
      setLoading(true);
      const params = new URLSearchParams({ query_str: queryStr || '', page: 1, limit: 100 });
      const res = await fetch(`${API_BASE}/search?${params}`);
      const data = await handleResponse(res);
      if (data.success) {
        setRecords(data.data || []);
      }
    } catch (err) {
      showToast(err.message || "Lỗi kết nối!", "error");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { handleSearch(''); }, []);

  useEffect(() => {
    const timer = setTimeout(() => handleSearch(searchQuery), 400);
    return () => clearTimeout(timer);
  }, [searchQuery, handleSearch]);

  const handleSearchRef = useRef(handleSearch);
  useEffect(() => { handleSearchRef.current = handleSearch; }, [handleSearch]);

  useEffect(() => {
    const supabaseClient = getSupabaseClient();
    if (!supabaseClient) return;

    const channel = supabaseClient
      .channel('reception-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'repairs' }, (payload) => {
        if (handleSearchRef.current) handleSearchRef.current(searchQuery);
      })
      .subscribe();

    return () => { supabaseClient.removeChannel(channel); };
  }, [searchQuery]);

  const kanbanColumns = useMemo(() => {
    if (activeWorkflow === 'repair') {
      const repairRecords = records.filter(r => (r.current_process || 'repair').toLowerCase() === 'repair');
      return [
        { id: 'received', title: '1. Thông tin Đơn sửa', colorClass: 'border-t-4 border-amber-500', headerBg: 'bg-[#181208]', textColor: 'text-amber-400', items: repairRecords.filter(r => (r.status || '').toLowerCase() === 'received') },
        { id: 'processing', title: '2. Tiến hành kiểm tra', colorClass: 'border-t-4 border-purple-500', headerBg: 'bg-[#120a1a]', textColor: 'text-purple-400', items: repairRecords.filter(r => ['processing', 'repairing'].includes((r.status || '').toLowerCase())) },
        { id: 'fixed', title: '3. Hoàn thành sửa', colorClass: 'border-t-4 border-emerald-500', headerBg: 'bg-[#061711]', textColor: 'text-emerald-400', items: repairRecords.filter(r => (r.status || '').toLowerCase() === 'fixed') },
        { id: 'failed', title: '4. Thất bại / Hủy sửa', colorClass: 'border-t-4 border-rose-500', headerBg: 'bg-[#1c080d]', textColor: 'text-rose-400', items: repairRecords.filter(r => (r.status || '').toLowerCase() === 'cancelled' || r.repair_result === 'failed') }
      ];
    }
    if (activeWorkflow === 'storage') {
      const storageRecords = records.filter(r => (r.current_process || '').toLowerCase() === 'storage');
      return [
        { id: 'storage_pending', title: 'Chờ Nhập Kho', colorClass: 'border-t-4 border-amber-500', headerBg: 'bg-[#181208]', textColor: 'text-amber-400', items: storageRecords.filter(r => (r.storage_status || '').toLowerCase() === 'pending') },
        { id: 'storage_in', title: 'Bảo Quản Tại Kho', colorClass: 'border-t-4 border-sky-500', headerBg: 'bg-[#081524]', textColor: 'text-sky-400', items: storageRecords.filter(r => (r.storage_status || '').toLowerCase() === 'in_company') },
        { id: 'storage_out', title: 'Đã Xuất Kho / Trả', colorClass: 'border-t-4 border-emerald-500', headerBg: 'bg-[#061711]', textColor: 'text-emerald-400', items: storageRecords.filter(r => (r.storage_status || '').toLowerCase() === 'dispatched') }
      ];
    }
    if (activeWorkflow === 'delivery') {
      const deliveryRecords = records.filter(r => (r.current_process || '').toLowerCase() === 'delivery');
      return [
        { id: 'delivery_pending', title: 'Chờ Phân Công', colorClass: 'border-t-4 border-amber-500', headerBg: 'bg-[#181208]', textColor: 'text-amber-400', items: deliveryRecords.filter(r => (r.delivery_status || '').toLowerCase() === 'pending') },
        { id: 'delivering', title: 'Đang Trên Đường Giao', colorClass: 'border-t-4 border-indigo-500', headerBg: 'bg-[#0e0e26]', textColor: 'text-indigo-400', items: deliveryRecords.filter(r => (r.delivery_status || '').toLowerCase() === 'delivering') },
        { id: 'delivered', title: 'Đã Bàn Giao Xong', colorClass: 'border-t-4 border-emerald-500', headerBg: 'bg-[#061711]', textColor: 'text-emerald-400', items: deliveryRecords.filter(r => (r.delivery_status || '').toLowerCase() === 'delivered') }
      ];
    }
    return [
      { id: 'all_received', title: 'Đang Xử Lý', colorClass: 'border-t-4 border-sky-500', headerBg: 'bg-[#081524]', textColor: 'text-sky-400', items: records.filter(r => r.status !== 'returned') },
      { id: 'all_returned', title: 'Đã Bàn Giao', colorClass: 'border-t-4 border-emerald-500', headerBg: 'bg-[#061711]', textColor: 'text-emerald-400', items: records.filter(r => r.status === 'returned') }
    ];
  }, [records, activeWorkflow]);

  // KÍCH HOẠT MODAL XÓA
  const openDeleteModal = (record) => {
    const isCreator = record.created_by && record.created_by === currentUser.username;
    const isAdmin = ['admin', 'super admin', 'system admin'].includes((currentUser.role || '').toLowerCase());

    if (!isAdmin && !isCreator) {
      return showToast("⚠️ Bạn không có quyền xóa phiếu này!", "error");
    }
    setDeleteModalRecord(record);
  };

  // THỰC THI XÓA SAU KHIN NGƯỜI DÙNG BẤM "XÓA VĨNH VIỄN" TRÊN MODAL
  const handleDeleteConfirm = async () => {
    if (!deleteModalRecord) return;
    setIsDeleting(true);
    try {
      const res = await fetch(`${API_BASE}/${deleteModalRecord.id}`, { method: 'DELETE' });
      await handleResponse(res);  // ✅ Chỉ dùng API (soft delete), không xóa cứng
      showToast(`Đã hủy phiếu [${deleteModalRecord.code}]!`, 'success');
      setDeleteModalRecord(null);
      handleSearch(searchQuery);
    } catch (err) {
      showToast(err.message || "Lỗi khi xóa phiếu!", "error");
    } finally {
      setIsDeleting(false);
    }
  };

  const handleReturnClick = (record) => {
    const status = (record.status || '').toLowerCase();
    const currentProcess = (record.current_process || 'repair').toLowerCase();
    if (currentProcess === 'delivery') return showToast("🚚 Đang thuộc Quy trình Giao nhận!", "error");
    if (currentProcess === 'repair' && (status === 'processing' || status === 'repairing')) return showToast("⚙ Thiết bị đang sửa!", "error");
    setReturnModalRecord(record);
    setReturnForm({ returned_method: 'Trực tiếp tại cửa hàng', returned_note: '' });
  };

  const handleReturnSubmit = async (e) => {
    e.preventDefault();
    setIsSubmittingReturn(true);
    try {
      const payload = { 
        status: 'returned', 
        returned_method: returnForm.returned_method, 
        returned_note: returnForm.returned_note, 
        is_fixed: returnModalRecord.status === 'fixed' 
      };
      let res = await fetch(`${API_BASE}/${returnModalRecord.id}/return`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      // ✅ Fallback PUT chỉ gửi status (không có field khác → không lỗi 422)
      if (!res.ok) {
        res = await fetch(`${API_BASE}/${returnModalRecord.id}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'returned' })
        });
      }
      await handleResponse(res);
      showToast(`Đã xác nhận trả thiết bị!`, 'success');
      setReturnModalRecord(null);
      handleSearch(searchQuery);
    } catch (err) { 
      showToast(err.message, "error"); 
    } finally { 
      setIsSubmittingReturn(false); 
    }
  };

  const openEditModal = (record) => {
    setEditingRecord(record);
    setEditForm({ customer_name: record.customer_name || '', phone: record.phone || '', address: record.address || '', note: record.note || '', received_note: record.received_note || '' });
  };

  const handleEditSubmit = async (e) => {
    e.preventDefault();
    setIsSaving(true);
    try {
      const res = await fetch(`${API_BASE}/${editingRecord.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(editForm) });
      await handleResponse(res);
      showToast(`✅ Đã cập nhật!`, 'success');
      setEditingRecord(null);
      handleSearch(searchQuery);
    } catch (err) { showToast(err.message, "error"); } finally { setIsSaving(false); }
  };

  return (
    <div className="w-full flex flex-col h-[calc(100vh-140px)] max-w-full">
      {toast && (
        <div className="fixed top-16 right-4 z-50 p-4 rounded-xl shadow-2xl bg-emerald-900 border border-emerald-500 text-emerald-100 flex items-center gap-3">
          <span className="text-sm font-semibold">{toast.message}</span>
        </div>
      )}

      {/* THANH TÌM KIẾM, TOGGLE MENU & TAB MOBILE */}
      <div className="mb-4 shrink-0 space-y-3">
        <div className="flex items-center gap-3">
          <button 
            onClick={() => setIsSidebarOpen(!isSidebarOpen)}
            className="hidden md:flex w-10 h-10 shrink-0 items-center justify-center bg-[#0f1424] border border-slate-700 rounded-lg hover:bg-sky-600/20 hover:text-sky-400 hover:border-sky-500/50 text-slate-400 transition-all shadow-sm"
            title={isSidebarOpen ? "Thu gọn Menu" : "Mở rộng Menu"}
          >
            <i className={`fa-solid ${isSidebarOpen ? 'fa-outdent' : 'fa-indent'}`}></i>
          </button>

          <div className="relative w-full max-w-md">
            <i className={`fa-solid ${loading ? 'fa-spinner animate-spin text-sky-400' : 'fa-magnifying-glass text-gray-400'} absolute left-3.5 top-2.5 text-sm`}></i>
            <input type="text" placeholder="Tìm SĐT, tên khách, mã phiếu..."
              value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full pl-10 pr-4 py-2 bg-[#0a0f1d]/70 border border-slate-700 rounded-lg text-sm text-white focus:border-sky-400 outline-none" />
          </div>
        </div>

        <div className="md:hidden flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
          {WORKFLOWS.map(wf => (
            <button key={wf.id} onClick={() => setActiveWorkflow(wf.id)}
              className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap flex items-center gap-1.5 border transition-all ${
                activeWorkflow === wf.id ? 'bg-sky-600 border-sky-400 text-white shadow-md' : 'bg-[#0f1424] border-slate-800 text-gray-400 hover:text-white'
              }`}>
              <i className={`fa-solid ${wf.icon}`}></i> <span>{wf.name}</span>
            </button>
          ))}
        </div>
      </div>

      {/* BỐ CỤC CHÍNH (SIDEBAR + KANBAN) */}
      <div className="flex-1 flex overflow-hidden">
        
        {/* MENU TRÁI */}
        <div className={`hidden md:flex flex-col bg-[#0f1424] rounded-xl border-slate-800 shrink-0 shadow-xl overflow-hidden transition-all duration-300 ease-in-out ${
          isSidebarOpen ? 'w-56 p-3 mr-4 border opacity-100' : 'w-0 p-0 mr-0 border-0 opacity-0'
        }`}>
          <div className="w-[12.5rem] flex flex-col">
            <div className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-3 px-2 flex items-center justify-between">
              <span>Danh Sách Quy Trình</span>
              <i className="fa-solid fa-sitemap text-sky-400"></i>
            </div>
            <div className="space-y-1.5">
              {WORKFLOWS.map(wf => {
                const isActive = activeWorkflow === wf.id;
                return (
                  <button key={wf.id} onClick={() => setActiveWorkflow(wf.id)}
                    className={`w-full p-2.5 rounded-lg text-xs font-bold flex items-center justify-between transition-all border ${
                      isActive ? 'bg-sky-600/20 border-sky-500/50 text-sky-300 shadow-inner' : 'border-transparent text-gray-400 hover:bg-slate-800/60 hover:text-slate-200'
                    }`}>
                    <div className="flex items-center gap-2.5">
                      <i className={`fa-solid ${wf.icon} text-sm ${isActive ? 'text-sky-400' : 'text-gray-500'}`}></i> <span>{wf.name}</span>
                    </div>
                    {isActive && <i className="fa-solid fa-chevron-right text-[10px]"></i>}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {/* BẢNG KANBAN CUỘN ĐỒNG BỘ CẢ 4 CỘT */}
        <div className="kanban-container hide-scrollbar flex-1 items-start">
          {kanbanColumns.map(col => (
            <div key={col.id} className={`kanban-col min-w-[280px] sm:min-w-[320px] flex-1 shrink-0 flex flex-col bg-[#0f1424] rounded-xl border border-slate-800 shadow-lg overflow-hidden ${col.colorClass}`}>
              
              <div className={`p-3 border-b border-slate-800 sticky top-0 z-10 flex justify-between items-center ${col.headerBg}`}>
                <h3 className={`font-bold text-xs sm:text-sm ${col.textColor}`}>{col.title}</h3>
                <span className="bg-black/40 text-gray-300 px-2 py-0.5 rounded-full text-[10px] font-black border border-slate-700">
                  {col.items.length}
                </span>
              </div>

              <div className="p-2.5 space-y-3">
                {col.items.length === 0 ? (
                  <div className="text-center py-10 opacity-30">
                    <i className="fa-solid fa-inbox text-2xl mb-1.5"></i>
                    <p className="text-xs">Chưa có nhiệm vụ</p>
                  </div>
                ) : (
                  col.items.map(r => {
                    const status = (r.status || '').toLowerCase();
                    const process = (r.current_process || 'repair').toLowerCase();
                    const storageStatus = (r.storage_status || '').toLowerCase();
                    const deliveryStatus = (r.delivery_status || '').toLowerCase();

                    const isReturned = status === 'returned' || storageStatus === 'dispatched' || deliveryStatus === 'delivered';
                    const isDelivery = process === 'delivery' || (deliveryStatus && deliveryStatus !== 'delivered');
                    const isProcessing = process === 'repair' && (status === 'processing' || status === 'repairing');

                    const isCreator = r.created_by && r.created_by === currentUser.username;
                    const isAdmin = ['admin', 'super admin', 'system admin'].includes((currentUser.role || '').toLowerCase())
                    const canDelete = isAdmin || isCreator;

                    return (
                      <div key={r.id} className="bg-[#162036] rounded-lg p-3 border border-slate-700 hover:border-slate-500 transition-colors shadow-sm relative group">
                        
                        {/* NÚT XÓA Ở GÓC PHẢI THẺ */}
                        {canDelete && (
                          <button
                            onClick={(e) => { e.stopPropagation(); openDeleteModal(r); }}
                            className="absolute top-2.5 right-2.5 w-6 h-6 rounded bg-rose-950/70 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-800/60 flex items-center justify-center transition-all opacity-80 hover:opacity-100 z-10"
                            title="Xóa phiếu này"
                          >
                            <i className="fa-solid fa-trash-can text-[10px]"></i>
                          </button>
                        )}

                        <div className="flex justify-between items-start mb-2 pr-6">
                          <div className="flex flex-col gap-1">
                            <span className="text-[10px] w-fit bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-600 font-monospace font-bold">
                              {r.code}
                            </span>
                            
                            {process === 'delivery' ? (
                              <span className="text-[9px] w-fit bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-500/30 font-semibold">🚚 Q.Trình Giao Nhận</span>
                            ) : process === 'storage' ? (
                              <span className="text-[9px] w-fit bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/30 font-semibold">📦 Q.Trình Lưu Kho</span>
                            ) : (
                              <span className="text-[9px] w-fit bg-sky-500/20 text-sky-300 px-1.5 py-0.5 rounded border border-sky-500/30 font-semibold">⚙ Q.Trình Sửa Chữa</span>
                            )}
                          </div>
                          <span className="text-[10px] text-gray-400 font-monospace">{r.created_at ? new Date(r.created_at).toLocaleDateString('vi-VN') : '—'}</span>
                        </div>
                        
                        <h4 className="font-bold text-sm text-white">{r.customer_name}</h4>
                        <p className="text-[11px] text-gray-400 mt-0.5 font-monospace"><i className="fa-solid fa-phone mr-1"></i>{r.phone || '—'}</p>
                        
                        <div className="mt-2 text-[11px] bg-black/20 p-2 rounded border border-slate-700/50 space-y-1">
                          <div><span className="text-gray-400">Lỗi báo: </span><span className="text-amber-100 font-medium">{r.note || 'Không có'}</span></div>
                          {r.received_note && <div><span className="text-gray-400">Nhận máy: </span><span className="text-slate-300">{r.received_note}</span></div>}
                          {r.address && <div><span className="text-gray-400">Thông tin: </span><span className="text-sky-300">{r.address}</span></div>}
                        </div>

                        <div className="mt-3 flex gap-1.5 pt-3 border-t border-slate-700/50">
                          <button onClick={() => openEditModal(r)} className="flex-1 h-8 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-[11px] font-bold transition-all"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => sendReceptionSms(r, hotlinePhone)} className="flex-[2] h-8 bg-sky-600/80 hover:bg-sky-500 text-white rounded text-[11px] font-bold transition-all flex items-center justify-center gap-1"><i className="fa-solid fa-sms"></i> SMS</button>
                          
                          {isReturned ? (
                            <div className="flex-[2] h-8 flex items-center justify-center bg-emerald-900/50 text-emerald-400 rounded text-[11px] font-bold border border-emerald-500/30"><i className="fa-solid fa-circle-check mr-1"></i> Đã Trả</div>
                          ) : isDelivery ? (
                            <button disabled className="flex-[2] h-8 flex items-center justify-center bg-slate-800/60 text-slate-400 rounded text-[10px] font-bold border border-slate-700/50 cursor-not-allowed opacity-70"><i className="fa-solid fa-truck-fast mr-1 text-indigo-400"></i> Giao Nhận</button>
                          ) : isProcessing ? (
                            <button disabled className="flex-[2] h-8 flex items-center justify-center bg-slate-800/60 text-slate-500 rounded text-[10px] font-bold border border-slate-700/50 cursor-not-allowed opacity-60"><i className="fa-solid fa-lock mr-1"></i> Đang Sửa</button>
                          ) : (
                            <button onClick={() => handleReturnClick(r)} className="flex-[2] h-8 bg-amber-600 hover:bg-amber-500 text-white rounded text-[11px] font-bold shadow-md transition-all flex items-center justify-center gap-1"><i className="fa-solid fa-box-check"></i> Trả Khách</button>
                          )}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* MODAL CẢNH BÁO XÓA CẨN THẬN */}
      {deleteModalRecord && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#0e1424] max-w-sm w-full p-5 border border-rose-500/50 rounded-xl shadow-2xl space-y-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 text-lg shrink-0">
                <i className="fa-solid fa-triangle-exclamation"></i>
              </div>
              <div>
                <h3 className="text-sm font-bold text-white">Xác Nhận Xóa Phiếu</h3>
                <p className="text-xs text-rose-400 font-medium mt-0.5">Hành động này không thể hoàn tác!</p>
              </div>
            </div>

            <div className="bg-black/40 p-3 rounded-lg border border-slate-800 text-xs space-y-1.5">
              <div className="flex justify-between"><span className="text-gray-400">Mã phiếu:</span><span className="text-amber-400 font-mono font-bold">{deleteModalRecord.code}</span></div>
              <div className="flex justify-between"><span className="text-gray-400">Khách hàng:</span><span className="text-white font-bold">{deleteModalRecord.customer_name}</span></div>
              {deleteModalRecord.phone && <div className="flex justify-between"><span className="text-gray-400">SĐT:</span><span className="text-slate-300 font-mono">{deleteModalRecord.phone}</span></div>}
            </div>

            <div className="flex gap-2 pt-1">
              <button 
                type="button" 
                onClick={() => setDeleteModalRecord(null)} 
                disabled={isDeleting}
                className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-300 transition-all"
              >
                Hủy Bỏ
              </button>
              <button 
                type="button" 
                onClick={handleDeleteConfirm} 
                disabled={isDeleting} 
                className="flex-[1.5] py-2 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white rounded-lg text-xs font-bold shadow-lg transition-all flex items-center justify-center gap-1.5"
              >
                {isDeleting ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-trash-can"></i>}
                <span>{isDeleting ? "Đang xóa..." : "Xóa Vĩnh Viễn"}</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL TRẢ MÁY */}
      {returnModalRecord && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#0e1424] max-w-sm w-full p-5 border border-emerald-500/40 rounded-xl shadow-2xl">
            <h3 className="text-sm font-bold text-emerald-400 mb-3"><i className="fa-solid fa-box-check"></i> Xác Nhận Trả Máy</h3>
            <form onSubmit={handleReturnSubmit} className="space-y-3">
              <select value={returnForm.returned_method} onChange={(e) => setReturnForm({...returnForm, returned_method: e.target.value})} className="w-full p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                <option value="Trực tiếp tại cửa hàng">🏪 Trực tiếp tại cửa hàng</option>
                <option value="Gửi Chành xe / Bưu điện">🚚 Gửi Chành xe / Bưu điện / CPN</option>
                <option value="Giao hàng tận nơi">🛵 GN của công ty đi giao</option>
              </select>
              <textarea placeholder="Ghi chú trả máy (nếu có)" value={returnForm.returned_note} onChange={(e) => setReturnForm({...returnForm, returned_note: e.target.value})} className="w-full p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white h-20"></textarea>
              <div className="flex gap-2">
                <button type="button" onClick={() => setReturnModalRecord(null)} className="flex-1 py-2 bg-slate-700 rounded text-xs font-bold text-white">Hủy</button>
                <button type="submit" disabled={isSubmittingReturn} className="flex-[2] py-2 bg-emerald-600 rounded text-xs font-bold text-white">Xác Nhận</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL SỬA PHIẾU */}
      {editingRecord && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#0e1424] max-w-md w-full p-5 border border-slate-700 rounded-xl">
            <h3 className="text-sm font-bold text-sky-400 mb-3"><i className="fa-solid fa-pen"></i> Sửa Phiếu [{editingRecord.code}]</h3>
            <form onSubmit={handleEditSubmit} className="space-y-3">
              <input placeholder="Họ tên" value={editForm.customer_name} onChange={e=>setEditForm({...editForm, customer_name: e.target.value})} className="w-full p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white" />
              <input placeholder="SĐT" value={editForm.phone} onChange={e=>setEditForm({...editForm, phone: e.target.value})} className="w-full p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white" />
              <input placeholder="Lỗi" value={editForm.note} onChange={e=>setEditForm({...editForm, note: e.target.value})} className="w-full p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white" />
              <div className="flex gap-2">
                <button type="button" onClick={() => setEditingRecord(null)} className="flex-1 py-2 bg-slate-700 rounded text-xs font-bold text-white">Hủy</button>
                <button type="submit" disabled={isSaving} className="flex-[2] py-2 bg-sky-600 rounded text-xs font-bold text-white">Lưu Lại</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ReceptionApp />);
</script>
{% endraw %}
{% endblock %}
