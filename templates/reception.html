{% raw %}
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API_BASE = "/api/reception";

const WORKFLOWS = [
  { id: 'repair', name: 'Sửa Chữa - Bảo Hành', icon: 'fa-screwdriver-wrench' },
  { id: 'storage', name: 'Lưu Kho Sửa Chữa', icon: 'fa-warehouse' },
  { id: 'delivery', name: 'Giao Nhận Hàng', icon: 'fa-truck-fast' },
  { id: 'installation', name: 'Kỹ Thuật Lắp Đặt', icon: 'fa-truck-ramp-box' },
  { id: 'all', name: 'Tất Cả Đơn Hàng', icon: 'fa-layer-group' }
];

const getSupabaseClient = () => {
  if (window._supabaseInstance) return window._supabaseInstance;
  const url = window.SUPABASE_URL || '';
  const key = window.SUPABASE_ANON_KEY || window.SUPABASE_KEY || '';
  if (url && key && window.supabase) {
    window._supabaseInstance = window.supabase.createClient(url, key);
    return window._supabaseInstance;
  }
  return null;
};

const handleResponse = async (res) => {
  if (res.status === 401) {
    window.location.href = '/login';
    throw new Error('Vui lòng đăng nhập lại');
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || data.message || 'Yêu cầu thất bại');
  return data;
};

const removeAccents = (str) => {
  if (!str) return '';
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
};

const normalizePhoneDigits = (phone) => {
  const digits = String(phone || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.startsWith('84') && digits.length >= 11) {
    return '0' + digits.slice(2);
  }
  return digits;
};

const formatDateTimeShort = (rawTime) => {
  if (!rawTime) return '';
  const parsed = new Date(rawTime);
  if (Number.isNaN(parsed.getTime())) return String(rawTime);
  return parsed.toLocaleTimeString('vi-VN', {
    hour: '2-digit',
    minute: '2-digit',
    day: '2-digit',
    month: '2-digit',
  });
};

const formatSmsTime = formatDateTimeShort;

const EMPTY_SMS_NOTES = new Set([
  '',
  'chua ghi chu',
  'chua ghi nhan',
  'binh thuong',
  'no value',
  'null',
  'none',
]);

const sendReceptionSms = (record, hotline = '', trackingDomain = '') => {
  if (!record || !record.phone) return;

  const cleanPhone = normalizePhoneDigits(record.phone);
  if (!cleanPhone) return;

  const nowStr = new Date(record.created_at || Date.now()).toLocaleDateString('vi-VN');
  const cleanCustomerName =
    removeAccents(record.customer_name || '').trim() || 'Khach le';

  const recNote = removeAccents(record.received_note || '').trim();
  const reqNote = removeAccents(record.note || '').trim();
  const validNote = !EMPTY_SMS_NOTES.has(recNote.toLowerCase())
    ? recNote
    : !EMPTY_SMS_NOTES.has(reqNote.toLowerCase())
      ? reqNote
      : '';

  const notePart = validNote ? `. Tinh trang: ${validNote}` : '';
  const lhPart = hotline ? `. LH: ${String(hotline).trim()}` : '';

  const smsText =
    `May in Dai Thanh tao phieu [${record.code}] tiep nhan thiet bi KH ${cleanCustomerName} ` +
    `luc ${nowStr}${notePart}${lhPart}`;

  const encodedText = encodeURIComponent(smsText);
  const isIOS =
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const targetLink = isIOS
    ? `sms:${cleanPhone}&body=${encodedText}`
    : `sms:${cleanPhone}?body=${encodedText}`;

  window.location.href = targetLink;
};

function ReceptionApp() {
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);
  const searchReqIdRef = useRef(0);

  const [searchQuery, setSearchQuery] = useState('');
  const [records, setRecords] = useState([]);
  const [installRecords, setInstallRecords] = useState([]);
  const [hotlinePhone, setHotlinePhone] = useState('');
  const [trackingDomain, setTrackingDomain] = useState('https://cskh-nu.vercel.app');
  const [activeWorkflow, setActiveWorkflow] = useState('repair');
  const [isSidebarOpen, setIsSidebarOpen] = useState(true);

  const [sentSmsMap, setSentSmsMap] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('reception_sent_sms') || '{}');
    } catch {
      return {};
    }
  });

  const [sentLinkMap, setSentLinkMap] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('reception_sent_link') || '{}');
    } catch {
      return {};
    }
  });

  const [staffFilter, setStaffFilter] = useState('');
  const [staffRoleFilter, setStaffRoleFilter] = useState('all'); // 'all' | 'creator' | 'updater' | 'responder' | 'assignee'
  const [quickFilter, setQuickFilter] = useState('all');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [isFilterOpen, setIsFilterOpen] = useState(false);
  const filterPopoverRef = useRef(null);

  useEffect(() => {
    const handleClickOutside = (e) => {
      if (filterPopoverRef.current && !filterPopoverRef.current.contains(e.target)) {
        setIsFilterOpen(false);
      }
    };
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  // Reset bộ lọc nhanh đặc thù khi chuyển đổi giữa KTLĐ và các quy trình khác
  useEffect(() => {
    setQuickFilter('all');
    if (activeWorkflow !== 'installation' && staffRoleFilter === 'assignee') {
      setStaffRoleFilter('all');
    }
    if (activeWorkflow === 'installation' && staffRoleFilter === 'responder') {
      setStaffRoleFilter('all');
    }
  }, [activeWorkflow]);

  const activeFilterCount = useMemo(() => {
    let count = 0;
    if (staffFilter.trim()) count += 1;
    if (staffRoleFilter !== 'all') count += 1;
    if (quickFilter !== 'all') count += 1;
    if (dateFrom || dateTo) count += 1;
    return count;
  }, [staffFilter, staffRoleFilter, quickFilter, dateFrom, dateTo]);

  const resetAllFilters = () => {
    setStaffFilter('');
    setStaffRoleFilter('all');
    setQuickFilter('all');
    setDateFrom('');
    setDateTo('');
  };

  // Tự động tổng hợp danh sách nhân viên theo quy trình đang chọn
  const staffOptions = useMemo(() => {
    const counts = new Map();
    const addPerson = (rawName) => {
      const name = String(rawName || '').trim();
      if (!name || name.toLowerCase() === 'none') return;
      counts.set(name, (counts.get(name) || 0) + 1);
    };

    const sourceList = activeWorkflow === 'installation' ? (installRecords || []) : (records || []);
    sourceList.forEach((r) => {
      const fields =
        activeWorkflow === 'installation'
          ? [r.warranty_created_by, r.warranty_updated_by, r.updated_by, r.assignee_name]
          : [r.created_by, r.updated_by, r.returned_by, r.sms_sent_by, r.link_sent_by];

      const seen = new Set();
      fields.forEach((f) => {
        const clean = String(f || '').trim();
        if (clean && !seen.has(clean)) {
          seen.add(clean);
          addPerson(clean);
        }
      });
    });

    return Array.from(counts.entries())
      .map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'vi'));
  }, [records, installRecords, activeWorkflow]);

  const filteredStaffOptions = useMemo(() => {
    const kw = removeAccents(staffFilter).toLowerCase().trim();
    if (!kw) return staffOptions;
    return staffOptions.filter((opt) => removeAccents(opt.name).toLowerCase().includes(kw));
  }, [staffOptions, staffFilter]);

  const matchesUniversalFilters = useCallback(
    (item, isInstall = false) => {
      const kw = removeAccents(searchQuery).toLowerCase().trim();
      const sKw = removeAccents(staffFilter).toLowerCase().trim();

      // 1. Lọc theo nhân viên & vai trò thao tác
      const creators = isInstall ? [item.warranty_created_by] : [item.created_by];
      const updaters = isInstall ? [item.warranty_updated_by, item.updated_by] : [item.updated_by];
      const responders = isInstall ? [] : [item.returned_by, item.sms_sent_by, item.link_sent_by];
      const assignees = isInstall ? [item.assignee_name] : [];

      const rolePools = {
        all: [...creators, ...updaters, ...responders, ...assignees],
        creator: creators,
        updater: updaters,
        responder: responders,
        assignee: assignees,
      };

      const selectedPool = (rolePools[staffRoleFilter] || rolePools.all).filter(Boolean);
      if (staffRoleFilter !== 'all' && !sKw && selectedPool.length === 0) {
        return false;
      }
      if (sKw) {
        const normalizedPool = selectedPool.map((x) => removeAccents(String(x)).toLowerCase());
        if (!normalizedPool.some((name) => name.includes(sKw))) {
          return false;
        }
      }

      // 2. Lọc nhanh theo đặc thù quy trình
      if (quickFilter !== 'all') {
        if (isInstall) {
          const hasWarranty = Boolean(item.warranty_record_id);
          const missingCustomer =
            !item.phone ||
            !item.customer_name ||
            ['khách lẻ', 'không lấy được tên kh'].includes(String(item.customer_name).trim().toLowerCase());
          if (quickFilter === 'no_warranty' && hasWarranty) return false;
          if (quickFilter === 'has_warranty' && !hasWarranty) return false;
          if (quickFilter === 'missing_info' && !missingCustomer) return false;
        } else {
          const key = String(item.id || item.code);
          const hasSms = Boolean(item.sms_sent_at || sentSmsMap[key]);
          const hasLink = Boolean(item.link_sent_at || sentLinkMap[key]);
          const missingPhone = !normalizePhoneDigits(item.phone);
          if (quickFilter === 'no_sms' && hasSms) return false;
          if (quickFilter === 'no_link' && hasLink) return false;
          if (quickFilter === 'missing_info' && !missingPhone) return false;
        }
      }

      // 3. Lọc theo khoảng ngày tạo
      if (dateFrom || dateTo) {
        const createdIso = item.created_at ? new Date(item.created_at).toLocaleDateString('en-CA') : '';
        if (dateFrom && (!createdIso || createdIso < dateFrom)) return false;
        if (dateTo && (!createdIso || createdIso > dateTo)) return false;
      }

      // 4. Lọc từ khóa chung (mã phiếu, SĐT, tên khách, model, serial, nhân viên)
      if (kw) {
        const haystack = removeAccents(
          isInstall
            ? [
                item.customer_name,
                item.phone,
                item.invoice_code,
                item.serial_number,
                item.model_hint,
                item.task_name,
                item.assignee_name,
                item.updated_by,
                item.warranty_created_by,
                item.warranty_updated_by,
              ].join(' ')
            : [
                item.customer_name,
                item.phone,
                item.code,
                item.note,
                item.received_note,
                item.created_by,
                item.updated_by,
                item.returned_by,
                item.sms_sent_by,
                item.link_sent_by,
              ].join(' ')
        ).toLowerCase();
        if (!haystack.includes(kw)) return false;
      }

      return true;
    },
    [searchQuery, staffFilter, staffRoleFilter, quickFilter, dateFrom, dateTo, sentSmsMap, sentLinkMap]
  );

  const [copiedTicketId, setCopiedTicketId] = useState(null);
  const [copiedPhoneId, setCopiedPhoneId] = useState(null);

  const [editingRecord, setEditingRecord] = useState(null);
  const [editForm, setEditForm] = useState({ customer_name: '', phone: '', address: '', note: '', received_note: '' });
  const [isSaving, setIsSaving] = useState(false);

  const [returnModalRecord, setReturnModalRecord] = useState(null);
  const [returnForm, setReturnForm] = useState({ returned_method: 'Trực tiếp tại cửa hàng', returned_note: '' });
  const [isSubmittingReturn, setIsSubmittingReturn] = useState(false);

  const [deleteModalRecord, setDeleteModalRecord] = useState(null);
  const [isDeleting, setIsDeleting] = useState(false);

  const currentUser = window.CURRENT_USER || { role: '', username: '' };

  const showToast = (message, type = 'success') => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ message, type });
    toastTimerRef.current = setTimeout(() => setToast(null), 5000);
  };

  const canDeleteTicket = Boolean(window.CAN_DELETE_TICKET);
  const canInstallWarranty = Boolean(window.CAN_INSTALL_WARRANTY);
  const [warrantyFormError, setWarrantyFormError] = useState('');
  const openDeleteModal = (record) => {
    if (!canDeleteTicket) {
      return showToast("⚠️ Bạn không có quyền xóa phiếu này!", "error");
    }
    setDeleteModalRecord(record);
  };

  useEffect(() => {
    const fetchSettings = async () => {
      try {
        const res = await fetch('/api/settings/config');
        if (res.ok) {
          const config = await res.json();
          const hotline = config?.sms_hotline || config?.hotline_repair || config?.hotline_warranty || '';
          if (hotline) setHotlinePhone(String(hotline).trim());
          if (config?.tracking_domain) setTrackingDomain(String(config.tracking_domain).trim());
        }
      } catch (err) {}
    };
    fetchSettings();
  }, []);

  // Copy nhanh SĐT khách hàng
  const handleCopyPhone = async (e, record) => {
    e.stopPropagation();
    const cleanPhone = normalizePhoneDigits(record?.phone);
    if (!cleanPhone) {
      return showToast("⚠️ Phiếu này chưa có số điện thoại!", "error");
    }

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(cleanPhone);
      } else {
        const tempInput = document.createElement('input');
        tempInput.value = cleanPhone;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
      }

      setCopiedPhoneId(record.id);
      showToast(`📋 Đã copy SĐT: ${cleanPhone}`, 'success');
      setTimeout(() => {
        setCopiedPhoneId((prev) => (prev === record.id ? null : prev));
      }, 1500);
    } catch {
      showToast("⚠️ Không thể copy tự động, vui lòng copy thủ công.", "error");
    }
  };

  // Gửi SMS có xác nhận lần đầu, cảnh báo gửi trùng & đồng bộ server
  const handleSmsClick = async (record) => {
    if (!record || !record.phone) {
      return showToast("⚠️ Phiếu này chưa có số điện thoại khách hàng!", "error");
    }

    const key = String(record.id || record.code);
    const rawPrevTime = record.sms_sent_at || sentSmsMap[key];
    const previousSentAt = formatSmsTime(rawPrevTime);

    if (previousSentAt) {
      const senderInfo = record.sms_sent_by ? ` bởi ${record.sms_sent_by}` : '';
      const confirmDuplicate = window.confirm(
        `⚠️ Phiếu [${record.code}] đã gửi SMS lúc ${previousSentAt}${senderInfo}.\n\nBạn có chắc chắn muốn gửi lại tin nhắn trùng cho khách không?`
      );
      if (!confirmDuplicate) return;
    } else {
      const confirmFirstSend = window.confirm(
        `Xác nhận gửi tin nhắn SMS cho khách ${record.customer_name || ''} (${record.phone})?\n\n` +
        `Lưu ý: Chỉ nhấn "OK" nếu bạn thực sự thao tác gửi tin nhắn (hệ thống sẽ ghi nhận trạng thái Đã SMS cho toàn bộ thiết bị).`
      );
      if (!confirmFirstSend) return;
    }

    const nowIso = new Date().toISOString();
    const timeLabel = formatSmsTime(nowIso);
    const currentSender = currentUser.ho_ten || currentUser.username || '';

    // 1. Cập nhật giao diện ngay lập tức (Optimistic UI)
    const nextMap = { ...sentSmsMap, [key]: timeLabel };
    setSentSmsMap(nextMap);
    setRecords((prev) =>
      prev.map((item) =>
        item.id === record.id
          ? { ...item, sms_sent_at: nowIso, sms_sent_by: currentSender }
          : item
      )
    );
    try {
      localStorage.setItem('reception_sent_sms', JSON.stringify(nextMap));
    } catch {}

    // 2. Gửi API lưu xuống Supabase (keepalive: true giữ kết nối khi chuyển sang app Tin nhắn)
    if (record.id) {
      fetch(`${API_BASE}/${record.id}/sms-sent`, {
        method: 'POST',
        keepalive: true,
      })
        .then(handleResponse)
        .catch((err) => {
          showToast(`⚠️ Chưa lưu được trạng thái SMS lên server: ${err.message}`, 'error');
        });
    }

    // 3. Mở ứng dụng nhắn tin trên điện thoại
    sendReceptionSms(record, hotlinePhone, trackingDomain);
  };

  // Copy link tra cứu hành trình đơn có xác nhận, chống gửi trùng & đồng bộ toàn hệ thống
  const handleShareTrackingLink = async (record) => {
    const cleanCode = String(record?.code || '').trim();
    const cleanPhone = normalizePhoneDigits(record?.phone);
    const keyword = cleanCode || cleanPhone;

    if (!keyword) {
      return showToast("⚠️ Không có mã phiếu hoặc SĐT để tạo link tra cứu!", "error");
    }

    const key = String(record.id || record.code);
    const rawPrevTime = record.link_sent_at || sentLinkMap[key];
    const previousSentAt = formatSmsTime(rawPrevTime);

    if (previousSentAt) {
      const senderInfo = record.link_sent_by ? ` bởi ${record.link_sent_by}` : '';
      const confirmDuplicate = window.confirm(
        `⚠️ Link tra cứu phiếu [${cleanCode || keyword}] đã được copy gửi khách lúc ${previousSentAt}${senderInfo}.\n\nBạn có chắc chắn muốn copy gửi lại lần nữa không?`
      );
      if (!confirmDuplicate) return;
    } else {
      const confirmFirstCopy = window.confirm(
        `Xác nhận copy link tra cứu hành trình để gửi cho khách ${record.customer_name || ''}?\n\n` +
        `Lưu ý: Chỉ nhấn "OK" nếu bạn sẽ gửi link này cho khách (hệ thống sẽ đánh dấu "Đã gửi link" để các nhân viên khác nhận biết).`
      );
      if (!confirmFirstCopy) return;
    }

    const rawDomain = (trackingDomain || 'https://cskh-nu.vercel.app').trim();
    const baseUrl = rawDomain.startsWith('http')
      ? rawDomain.replace(/\/+$/, '')
      : `https://${rawDomain.replace(/\/+$/, '')}`;
    const shareUrl = `${baseUrl}/tracking/${encodeURIComponent(keyword)}`;

    // 1. Copy vào clipboard (tách riêng lỗi clipboard)
    let copiedOk = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(shareUrl);
      } else {
        const tempInput = document.createElement('input');
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
      }
      copiedOk = true;
    } catch {
      window.prompt('Copy đường link tra cứu hành trình bên dưới:', shareUrl);
    }

    // 2. Đồng bộ xuống Supabase để các máy khác thấy ngay
    try {
      if (record.id) {
        const syncRes = await fetch(`${API_BASE}/${record.id}/link-sent`, {
          method: 'POST',
          keepalive: true,
        });
        await handleResponse(syncRes);
      }

      const nowIso = new Date().toISOString();
      const timeLabel = formatSmsTime(nowIso);
      const currentSender = currentUser.ho_ten || currentUser.username || '';

      const nextMap = { ...sentLinkMap, [key]: timeLabel };
      setSentLinkMap(nextMap);
      setRecords((prev) =>
        prev.map((item) =>
          item.id === record.id
            ? { ...item, link_sent_at: nowIso, link_sent_by: currentSender }
            : item
        )
      );
      try {
        localStorage.setItem('reception_sent_link', JSON.stringify(nextMap));
      } catch {}

      setCopiedTicketId(record.id);
      showToast(
        copiedOk
          ? `📋 Đã copy & đồng bộ gửi link phiếu [${cleanCode || keyword}]!`
          : `✅ Đã đồng bộ gửi link phiếu [${cleanCode || keyword}]!`,
        'success'
      );
      setTimeout(() => {
        setCopiedTicketId((prev) => (prev === record.id ? null : prev));
      }, 2000);
    } catch (err) {
      showToast(`⚠️ Đã copy link nhưng lỗi lưu lên server: ${err.message}`, 'error');
    }
  };

  const handleSearch = useCallback(
    async (
      queryStr,
      wf = activeWorkflow,
      extra = { staffName: staffFilter, staffRole: staffRoleFilter, from: dateFrom, to: dateTo }
    ) => {
      const reqId = ++searchReqIdRef.current;
      try {
        setLoading(true);
        const params = new URLSearchParams({
          query_str: queryStr || '',

    { event: '*', schema: 'public', table: 'installation_orders' },
    (payload) => {
      const { eventType, new: newRow, old: oldRow } = payload;
      setInstallRecords((prev) => {
        if (eventType === 'INSERT') {
          if (prev.some((item) => item.id === newRow.id)) return prev;
          return [newRow, ...prev];
        }
        if (eventType === 'UPDATE') {
          return prev.map((item) => (item.id === newRow.id ? { ...item, ...newRow } : item));
        }
        if (eventType === 'DELETE') {
          return prev.filter((item) => item.id !== oldRow.id);

    (warrantyCatalog.policies || []).forEach((p) => {
      const b = String(p.brand_name || '').trim().toUpperCase();

      const c = String(p.category || '').trim();
      const cKey = normCategoryKey(c);
      if (c && cKey && !['tatca', 'all', 'chung'].includes(cKey) && !catMap.has(cKey)) {
        catMap.set(cKey, c);
      }
    });

    (warrantyCatalog.printers || []).forEach((p) => {
      const b = String(p.brand_name || '').trim().toUpperCase();
      const bKey = normBrandKey(b);
      if (b && !ignoreBrands.has(bKey) && !brandMap.has(bKey)) brandMap.set(bKey, b);

      const c = String(p.category || '').trim();
      const cKey = normCategoryKey(c);
      if (c && cKey && !catMap.has(cKey)) catMap.set(cKey, c);
    });

    FALLBACK_CATEGORY_OPTIONS.forEach((c) => {
      const cKey = normCategoryKey(c);
      if (!catMap.has(cKey)) catMap.set(cKey, c);
    });

    const brands = Array.from(brandMap.values()).sort();

      availableBrands: brands,

    };

  const resolveCategoryLabel = (targetCat, printers = warrantyCatalog.printers, policies = warrantyCatalog.policies) => {
    const targetKey = normCategoryKey(targetCat);
    const allCats = [
      ...(policies || []).map((p) => p.category),
      ...(printers || []).map((p) => p.category),
      ...FALLBACK_CATEGORY_OPTIONS
    ].filter(Boolean);
    const matched = allCats.find((c) => normCategoryKey(c) === targetKey);
    return matched || targetCat;
  };

  const inferCategoryAndInkFromText = (text, printers = [], policies = []) => {
    const norm = removeAccents(String(text || '')).toLowerCase();
    if (norm.includes('cat be') || norm.includes('may cat') || norm.includes('plotter')) {
      return { category: resolveCategoryLabel('Cắt bế', printers, policies), ink_type: 'KHÔNG MỰC' };
    }
    if (norm.includes('scan')) {
      return { category: resolveCategoryLabel('Scan', printers, policies), ink_type: 'KHÔNG MỰC' };
    }
    if (norm.includes('ep nhiet') || norm.includes('can mang') || norm.includes('may say') || norm.includes('on ap') || norm.includes('thiet bi dien')) {
      return { category: resolveCategoryLabel('Thiết bị điện', printers, policies), ink_type: 'THIẾT BỊ ĐIỆN' };
    }
    if (norm.includes('laser')) {
      return { category: resolveCategoryLabel('In Laser', printers, policies), ink_type: 'MỰC LASER' };
    }
    return { category: resolveCategoryLabel('In phun', printers, policies), ink_type: '' };

    const inferred = inferCategoryAndInkFromText(modelHint, printers, policies);
    let category = inferred.category;
    let ink_type = inferred.ink_type;

    if (modelHint) {
      const hintNorm = normBrandKey(modelHint);

      // 1. Dò trong danh mục máy in (ưu tiên khớp dài nhất trước)
      const sortedPrinters = [...printers].sort(
        (a, b) => normBrandKey(b.model_code).length - normBrandKey(a.model_code).length
      );
      const found = sortedPrinters.find((p) => {
        const fullNorm = normBrandKey(`${p.brand_name || ''} ${p.model_code || ''}`);
        const codeNorm = normBrandKey(p.model_code || '');
        return (
          fullNorm === hintNorm ||
          codeNorm === hintNorm ||
          (hintNorm.length >= 3 && fullNorm.includes(hintNorm)) ||
          (codeNorm.length >= 3 && hintNorm.includes(codeNorm))
        );
      });

      if (found) {
        brand_name = String(found.brand_name || '').toUpperCase();

          category = resolveCategoryLabel(found.category, printers, policies);

        const knownBrands = Array.from(

        const matchedBrand = knownBrands.find((b) => hintNorm.includes(normBrandKey(b)));

          .trim();

        if (matchedBrand) {
          brand_name = matchedBrand;
          model_name = cleanedHint.replace(new RegExp(matchedBrand, 'i'), '').trim() || cleanedHint;
        } else {
          model_name = cleanedHint;
        }
      }
    }

      uid: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,

      model_search: `${brand_name} ${model_name}`.trim(),

      model_name,

      new_head: false,
      ink_type,
      policy_id: '',
      initial_counter: 0
    };

    const matchedPolicies = getFilteredPoliciesForDevice(baseDev, policies);
    if (matchedPolicies.length === 1) {
      baseDev.policy_id = String(matchedPolicies[0].id);
    }

    return baseDev;
  };

  // Nguyên tắc lọc gói BH: Lọc theo Hãng (brand) + Phân loại (category) (+ Tình trạng nếu gói có quy định)
  const getFilteredPoliciesForDevice = (dev, policiesList) => {
    const devBrand = normBrandKey(dev.brand_name);
    const devCat = normCategoryKey(dev.category);
    const devCond = normConditionKey(dev.condition);

    const universalBrands = new Set(['', 'tatca', 'all', 'chung', 'apdungchung']);
    const otherBrands = new Set(['khac', 'hangkhac', 'other']);
    const universalCats = new Set(['', 'tatca', 'all', 'chung', 'apdungchung']);
    const universalConds = new Set(['', 'tatca', 'all', 'chung', 'khongphanbiet']);

    // Lọc trước theo Phân loại + Tình trạng
    const byCatAndCond = (policiesList || []).filter((p) => {
      const polCat = normCategoryKey(p.category);
      const polCond = normConditionKey(p.condition);

      const okCat =
        !devCat ||
        universalCats.has(polCat) ||
        polCat === devCat ||
        (polCat.length >= 3 && devCat.length >= 3 && (polCat.includes(devCat) || devCat.includes(polCat)));

      const okCond = !devCond || universalConds.has(polCond) || polCond === devCond;
      return okCat && okCond;
    });

    if (!devBrand) {
      return byCatAndCond;
    }

    // Kiểm tra xem hãng này có gói riêng không
    const directMatches = byCatAndCond.filter((p) => {
      const polBrand = normBrandKey(p.brand_name);
      if (universalBrands.has(polBrand) || otherBrands.has(polBrand)) return false;
      return (
        polBrand === devBrand ||
        (polBrand.length >= 2 && devBrand.length >= 2 && (polBrand.includes(devBrand) || devBrand.includes(polBrand)))
      );
    });

    const universalMatches = byCatAndCond.filter((p) => universalBrands.has(normBrandKey(p.brand_name)));
    const otherMatches = byCatAndCond.filter((p) => otherBrands.has(normBrandKey(p.brand_name)));

    // Nếu chọn "KHÁC" hoặc hãng chưa có gói riêng -> lấy gói "KHÁC" + gói "TẤT CẢ"
    if (otherBrands.has(devBrand) || directMatches.length === 0) {
      return [...otherMatches, ...universalMatches];
    }

    // Hãng có gói riêng -> ưu tiên gói của Hãng đó + gói dùng chung "TẤT CẢ"
    return [...directMatches, ...universalMatches];
  };

  const getPolicyCounterMeta = (policy) => {
    if (!policy) return { enabled: false, unit: '-' };
    const hasMeter =
      policy.no_meter_limit !== true &&
      (Number(policy.meter_limit_body || 0) > 0 || Number(policy.meter_limit_head || 0) > 0);
    const hasPage =
      policy.no_page_limit !== true &&
      (Number(policy.page_limit_body || 0) > 0 || Number(policy.page_limit_head || 0) > 0);
    if (hasMeter) return { enabled: true, unit: 'm' };
    if (hasPage) return { enabled: true, unit: '#' };
    return { enabled: false, unit: '-' };
  };

  const openWarrantyModal = async (record, editMode = false) => {
  if (!canInstallWarranty) {
    return showToast("⛔ Bạn hoặc phòng ban của bạn không có quyền tạo/sửa phiếu bảo hành!", "error");
  }
  setWarrantyFormError('');
  let printers = warrantyCatalog.printers;
  let policies = warrantyCatalog.policies;

  setLoadingWarrantyOrderId(record.id);
  try {
    if (!warrantyCatalog.loaded) {
      const res = await fetch(`${API_BASE}/installations/warranty-options`);
      const data = await handleResponse(res);
      printers = data.printers || [];
      policies = data.policies || [];
      setWarrantyCatalog({ loaded: true, printers, policies });
    }

    if (editMode) {
      const wRes = await fetch(`${API_BASE}/installations/${record.id}/warranties`);
      const wData = await handleResponse(wRes);
      const existingList = wData.records || [];
      if (existingList.length === 0) {
        showToast('⚠️ Không tìm thấy phiếu bảo hành liên kết để sửa!', 'error');
        return;
      }

      const mappedDevices = existingList.map((wr) => {
        const rawModel = String(wr.model_name || '').trim();
        const hasNewHead = /đầu phun mới/i.test(rawModel);
        const cleanModel = rawModel.replace(/\s*-\s*Đầu phun mới\s*$/i, '').trim();
        const brand = String(wr.brand_name || '').trim().toUpperCase();
        return {
          id: wr.id,
          uid: String(wr.id),
          serial_number: String(wr.serial_number || '').trim().toUpperCase(),
          model_search: `${brand} ${cleanModel}`.trim(),
          brand_name: brand,
          model_name: cleanModel,
          category: resolveCategoryLabel(wr.category || 'In phun', printers, policies),
          condition: wr.condition || 'Máy mới',
          new_head: hasNewHead,
          ink_type: wr.ink_type || '',
          policy_id: String(wr.policy_id || ''),
          initial_counter: Number(wr.initial_counter || 0),
        };
      });

      const firstW = existingList[0];
      setWarrantyHeader({
        customer_name: firstW.customer_name || record.customer_name || '',
        phone_number: firstW.phone_number || record.phone || '',
        purchase_date: String(firstW.purchase_date || '').slice(0, 10) || new Date().toLocaleDateString('en-CA'),
      });
      setWarrantyDevices(mappedDevices);
      setIsEditWarrantyMode(true);
      setWarrantyModalRecord(record);
      return;
    }

    const serials = String(record.serial_number || '')
      .split(',')
      .map((s) => s.trim().toUpperCase())
      .filter(Boolean);

    const initialDevices =
      serials.length > 0
        ? serials.map((sn) => buildDeviceItem(sn, record.model_hint || '', printers, policies))
        : [buildDeviceItem('', record.model_hint || '', printers, policies)];

    setWarrantyHeader({
      customer_name: record.customer_name || '',
      phone_number: record.phone || '',
      purchase_date: new Date().toLocaleDateString('en-CA'),
    });
    setWarrantyDevices(initialDevices);
    setIsEditWarrantyMode(false);
    setWarrantyModalRecord(record);
  } catch (err) {
    showToast(`⚠️ ${err.message}`, 'error');
  } finally {
    setLoadingWarrantyOrderId(null);
  }
};

const handleCreateWarrantySubmit = async (e) => {
  e.preventDefault();
  if (!warrantyModalRecord) return;
  setIsCreatingWarranty(true);
  try {
    const payload = {
      customer_name: warrantyHeader.customer_name.trim(),
      phone_number: warrantyHeader.phone_number.trim(),
      purchase_date: warrantyHeader.purchase_date,
      items: warrantyDevices.map((d) => ({
        ...(d.id ? { id: d.id } : {}),
        serial_number: d.serial_number.trim().toUpperCase(),
        brand_name: d.brand_name.trim().toUpperCase(),
        model_name: d.model_name.trim(),
        category: d.category,
        condition: d.condition,
        new_head: Boolean(d.new_head),
        ink_type: d.ink_type,
        policy_id: d.policy_id,
        initial_counter: Number(d.initial_counter || 0),
      })),
    };

    const endpoint = isEditWarrantyMode
      ? `${API_BASE}/installations/${warrantyModalRecord.id}/warranties`
      : `${API_BASE}/installations/${warrantyModalRecord.id}/create-warranties`;

    const res = await fetch(endpoint, {
      method: isEditWarrantyMode ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await handleResponse(res);
    const allSns = payload.items.map((x) => x.serial_number).join(', ');

    setInstallRecords((prev) =>
      prev.map((item) =>
        item.id === warrantyModalRecord.id
          ? {
              ...item,
              customer_name: payload.customer_name,
              phone: payload.phone_number,
              serial_number: allSns,
              warranty_record_id: data.records?.[0]?.id || item.warranty_record_id || 'created',
              ...(data.warranty_created_by ? { warranty_created_by: data.warranty_created_by } : {}),
              ...(data.warranty_updated_by ? { warranty_updated_by: data.warranty_updated_by } : {}),
              ...(data.warranty_edit_log ? { warranty_edit_log: data.warranty_edit_log } : {}),
            }
          : item
      )
    );
    showToast(`🎉 ${data.message || 'Đã lưu phiếu bảo hành thành công!'}`, 'success');
    setWarrantyModalRecord(null);
  } catch (err) {
    const msg = err.message || 'Không thể lưu phiếu bảo hành!';
    setWarrantyFormError(msg);
    showToast(msg, 'error');
  } finally {
    setIsCreatingWarranty(false);
  }
};

  const updateWarrantyDevice = (uid, patch) => {
    setWarrantyDevices((prev) =>
      prev.map((dev) => {
        if (dev.uid !== uid) return dev;
        const updated = { ...dev, ...patch };

        // Đồng bộ thông minh giữa Phân loại <-> Loại mực
        if (patch.category !== undefined) {
          const catKey = normCategoryKey(patch.category);
          if (catKey === 'catbe' || catKey === 'scan') {
            if (!updated.ink_type || INK_PRINTER_OPTIONS.includes(updated.ink_type)) {
              updated.ink_type = 'KHÔNG MỰC';
            }
          } else if (catKey === 'thietbidien') {
            updated.ink_type = 'THIẾT BỊ ĐIỆN';
          } else if (catKey === 'thietbikhac') {
            updated.ink_type = 'THIẾT BỊ KHÁC';
          } else if (catKey === 'inlaser') {
            if (!updated.ink_type || INK_OTHER_DEVICE_OPTIONS.includes(updated.ink_type)) {
              updated.ink_type = 'MỰC LASER';
            }
          }
        }

        if (patch.ink_type !== undefined) {
          const curCatKey = normCategoryKey(updated.category);
          if (patch.ink_type === 'THIẾT BỊ ĐIỆN') {
            updated.category = resolveCategoryLabel('Thiết bị điện');
          } else if (patch.ink_type === 'THIẾT BỊ KHÁC') {
            updated.category = resolveCategoryLabel('Thiết bị khác');
          } else if (patch.ink_type === 'MỰC LASER' && curCatKey === 'inphun') {
            updated.category = resolveCategoryLabel('In Laser');
          }
        }

        if (updated.condition !== 'Đã qua sử dụng') {
          updated.new_head = false;
        }

        // Lọc lại gói bảo hành theo Hãng + Phân loại mới
        const matched = getFilteredPoliciesForDevice(updated, warrantyCatalog.policies);
        if (updated.policy_id && !matched.some((p) => String(p.id) === String(updated.policy_id))) {
          updated.policy_id = matched.length === 1 ? String(matched[0].id) : '';
          updated.initial_counter = 0;
        } else if (!updated.policy_id && matched.length === 1) {
          updated.policy_id = String(matched[0].id);
        }

        return updated;
      })
    );
  };

  const handleDeviceModelSearch = (uid, rawVal) => {
    const clean = normBrandKey(rawVal);
    const matched = warrantyCatalog.printers.find(
      (p) => normBrandKey(`${p.brand_name || ''} ${p.model_code || ''}`) === clean
    );
    if (matched) {
      updateWarrantyDevice(uid, {
        model_search: rawVal,
        brand_name: String(matched.brand_name || '').toUpperCase(),
        model_name: matched.model_code || '',
        category: resolveCategoryLabel(matched.category || 'In phun')
      });
    } else {
      const inferred = inferCategoryAndInkFromText(rawVal);
      const matchedBrand = availableBrands.find(
        (b) => b !== 'KHÁC' && clean.startsWith(normBrandKey(b))
      );
      if (matchedBrand) {
        const restModel = rawVal.trim().slice(matchedBrand.length).trim();
        updateWarrantyDevice(uid, {
          model_search: rawVal,
          brand_name: matchedBrand,
          model_name: restModel || rawVal.trim(),
          ...(inferred.ink_type ? { category: inferred.category, ink_type: inferred.ink_type } : {})
        });
      } else {
        updateWarrantyDevice(uid, {
          model_search: rawVal,
          model_name: rawVal.trim(),
          ...(inferred.ink_type ? { category: inferred.category, ink_type: inferred.ink_type } : {})
        });
      }
    }
  };

  return (
    <div className="w-full flex flex-col h-[calc(100vh-140px)] max-w-full">
      {toast && (
        <div className={`fixed top-16 right-4 z-[100] p-4 rounded-xl shadow-2xl border flex items-center gap-3 ${
		  toast.type === 'error'
			? 'bg-rose-950 border-rose-500 text-rose-100'
			: 'bg-emerald-950 border-emerald-500 text-emerald-100'
		}`}>
		  <span className="text-sm font-semibold">{toast.message}</span>
		</div>
      )}

      {/* THANH TÌM KIẾM, TOGGLE MENU & TAB MOBILE */}
      <div className="mb-4 shrink-0 space-y-2.5">
        <div className="flex items-center gap-2.5 flex-wrap">
          <button
            onClick={() => setIsSidebarOpen(!isSidebarOpen)}
            className="hidden md:flex w-10 h-10 shrink-0 items-center justify-center bg-[#0f1424] border border-slate-700 rounded-lg hover:bg-sky-600/20 hover:text-sky-400 hover:border-sky-500/50 text-slate-400 transition-all shadow-sm"
            title={isSidebarOpen ? "Thu gọn Menu" : "Mở rộng Menu"}
          >
            <i className={`fa-solid ${isSidebarOpen ? 'fa-outdent' : 'fa-indent'}`}></i>
          </button>

          {/* Ô TÌM KIẾM + NÚT BỘ LỌC TÍCH HỢP LIỀN KỀ */}
          <div className="relative flex-1 min-w-[260px] max-w-xl flex items-center" ref={filterPopoverRef}>
            <div className="relative flex-1">
              <i className={`fa-solid ${loading ? 'fa-spinner animate-spin text-sky-400' : 'fa-magnifying-glass text-gray-400'} absolute left-3.5 top-2.5 text-sm`}></i>
              <input
                type="text"
                placeholder="Tìm SĐT, tên khách, mã phiếu, serial, nhân viên..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-10 pr-8 py-2 bg-[#0a0f1d]/70 border border-slate-700 rounded-l-lg text-sm text-white focus:border-sky-400 outline-none"
              />
              {searchQuery && (
                <button
                  type="button"
                  onClick={() => setSearchQuery('')}
                  className="absolute right-2.5 top-2.5 text-gray-400 hover:text-white text-xs"
                  title="Xóa từ khóa"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>
              )}
            </div>

            {/* Nút mở Popover Bộ lọc đa dụng */}
            <button
              type="button"
              onClick={() => setIsFilterOpen((prev) => !prev)}
              className={`h-[38px] px-3.5 shrink-0 border-y border-r rounded-r-lg text-xs font-bold flex items-center gap-1.5 transition-all ${
                activeFilterCount > 0 || isFilterOpen
                  ? 'bg-sky-600/25 border-sky-500 text-sky-300'
                  : 'bg-[#0f1424] border-slate-700 text-slate-300 hover:bg-slate-800 hover:text-white'
              }`}
              title="Lọc theo nhân viên tạo/sửa, trạng thái & ngày tạo"
            >
              <i className="fa-solid fa-sliders"></i>
              <span>Bộ lọc</span>
              {activeFilterCount > 0 && (
                <span className="px-1.5 py-0.2 rounded-full bg-sky-500 text-slate-950 font-black text-[10px]">
                  {activeFilterCount}
                </span>
              )}
            </button>

            {/* POPOVER BỘ LỌC ĐA DỤNG CHO MỌI QUY TRÌNH */}
            {isFilterOpen && (
              <div className="absolute left-0 right-0 sm:left-auto sm:right-0 top-11 z-40 sm:w-[400px] bg-[#0e1424] border border-slate-700 rounded-xl shadow-2xl p-4 space-y-3.5 text-xs">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="font-bold text-sky-400 flex items-center gap-1.5">
                    <i className="fa-solid fa-filter"></i>
                    <span>Bộ Lọc Nâng Cao ({WORKFLOWS.find((w) => w.id === activeWorkflow)?.name})</span>
                  </span>
                  {activeFilterCount > 0 && (
                    <button
                      type="button"
                      onClick={resetAllFilters}
                      className="text-[11px] text-rose-400 hover:underline font-semibold"
                    >
                      Đặt lại tất cả

                  )}
                </div>

                {/* 1. Vai trò thao tác */}
                <div>
                  <label className="block text-[11px] font-semibold text-gray-400 mb-1">
                    Vai trò nhân sự thao tác

                  <select

                    onChange={(e) => setStaffRoleFilter(e.target.value)}

                    </option>
                    <option value="updater">
                      {activeWorkflow === 'installation' ? '✏️ Người chuẩn hóa đơn / sửa BH' : '✏️ Người cập nhật thông tin'}
                    </option>

                {/* 2. LiveSearch Nhân viên */}
                <div>
                  <label className="block text-[11px] font-semibold text-gray-400 mb-1">
                    Nhân viên thực hiện (LiveSearch)

                  <div className="relative">
                    <i className="fa-solid fa-user-check text-emerald-400 absolute left-3 top-2.5"></i>
                    <input
                      type="text"

                  {filteredStaffOptions.length > 0 && (

                {/* 3. Lọc nhanh thích ứng theo từng quy trình */}

                  >

                    ) : (
                      <>

                        <option value="no_link">🔗 Chưa gửi link tra cứu</option>
                        <option value="missing_info">⚠️ Phiếu thiếu SĐT khách</option>
                      </>
                    )}
                  </select>
                </div>

                {/* 4. Khoảng ngày tạo */}
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[11px] font-semibold text-gray-400 mb-1">Từ ngày</label>
                    <input
                      type="date"
                      value={dateFrom}
                      onChange={(e) => setDateFrom(e.target.value)}
                      className="w-full h-8 px-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono outline-none focus:border-sky-500"
                    />

                    />
                  </div>

          </div>

          {/* THẺ CHIP HIỂN THỊ NHANH CÁC BỘ LỌC ĐANG BẬT NGAY CẠNH THANH TÌM KIẾM */}
          {activeFilterCount > 0 && (
            <div className="flex flex-wrap items-center gap-1.5">
              {(staffFilter || staffRoleFilter !== 'all') && (
                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-[11px] font-semibold">
                  <i className="fa-solid fa-user-tag text-[10px]"></i>
                  <span>
                    {staffRoleFilter === 'creator'
                      ? 'Người tạo'
                      : staffRoleFilter === 'updater'
                        ? 'Người sửa'
                        : staffRoleFilter === 'assignee'
                          ? 'Phụ trách'
                          : staffRoleFilter === 'responder'
                            ? 'Trả máy/SMS'
                            : 'Nhân viên'}
                    {staffFilter ? `: ${staffFilter}` : ''}
                  </span>
                  <button
                    type="button"
                    onClick={() => { setStaffFilter(''); setStaffRoleFilter('all'); }}
                    className="hover:text-white ml-0.5"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>

                            className="w-full h-9 px-2.5 bg-slate-900 border border-slate-700 rounded-md font-semibold text-white focus:border-sky-500 outline-none"
                          >
                            <option value="Máy mới">Máy mới</option>
                            <option value="Đã qua sử dụng">Đã qua sử dụng</option>
                          </select>
                        </div>

                        {/* Checkbox đầu phun mới */}
                        <div className="sm:col-span-4 flex items-end">
                          <label
                            className={`w-full h-9 px-2.5 bg-slate-900 border border-slate-700 rounded-md flex items-center gap-2 select-none transition ${
                              isUsedMachine ? 'cursor-pointer text-white' : 'opacity-45 cursor-not-allowed text-gray-400'
                            }`}
                          >
                            <input
                              type="checkbox"
                              disabled={!isUsedMachine}
                              checked={Boolean(dev.new_head)}
                              onChange={(e) => updateWarrantyDevice(dev.uid, { new_head: e.target.checked })}
                              className="w-4 h-4 accent-sky-500"
                            />
                            <span className="font-semibold">Đầu phun mới</span>
                          </label>
                        </div>

                        {/* Loại mực */}
                        <div className="sm:col-span-4">
                          <label className="block text-[11px] font-semibold text-gray-400 mb-1">Loại mực / Thiết bị *</label>
                          <select
                            required
                            value={dev.ink_type}
                            onChange={(e) => updateWarrantyDevice(dev.uid, { ink_type: e.target.value })}
                            className="w-full h-9 px-2.5 bg-slate-900 border border-slate-700 rounded-md font-semibold text-white focus:border-sky-500 outline-none"
                          >
                            <option value="">-- Chọn loại mực / TB * --</option>
                            <optgroup label="Mực in (Máy in phun / Laser)">
                              {INK_PRINTER_OPTIONS.map((ink) => (
                                <option key={ink} value={ink}>{ink}</option>
                              ))}
                            </optgroup>
                            <optgroup label="Không mực / Thiết bị ngoài máy in">
                              {INK_OTHER_DEVICE_OPTIONS.map((opt) => (
                                <option key={opt} value={opt}>{opt}</option>
                              ))}
                            </optgroup>
                          </select>
                        </div>

                        {/* Gói bảo hành */}
                        <div className="sm:col-span-8">
                          <label className="block text-[11px] font-semibold text-gray-400 mb-1">
                            Gói bảo hành áp dụng * ({dev.brand_name || 'Chưa chọn hãng'} • {dev.category})
                          </label>
                          <select
                            required
                            value={dev.policy_id}
                            onChange={(e) => updateWarrantyDevice(dev.uid, { policy_id: e.target.value, initial_counter: 0 })}
                            className="w-full h-9 px-2.5 bg-slate-900 border border-slate-700 rounded-md font-semibold text-white focus:border-sky-500 outline-none"
                          >
                            <option value="">
                              {matchedPolicies.length > 0
                                ? `-- Chọn gói bảo hành (${matchedPolicies.length} gói phù hợp) --`
                                : '-- Không có gói khớp Hãng & Phân loại này --'}
                            </option>
                            {matchedPolicies.map((p) => (
                              <option key={p.id} value={p.id}>
                                {p.policy_name} ({p.warranty_months || 0}T - {p.head_warranty_months || 0}T)
                              </option>
                            ))}
                          </select>
                        </div>

                        {/* Counter ban đầu */}
                        <div className="sm:col-span-4">
                          <label className="block text-[11px] font-semibold text-gray-400 mb-1">
                            Counter ban đầu {counterMeta.enabled && counterMeta.unit !== '-' ? `(${counterMeta.unit})` : ''}
                          </label>
                          <input
                            type="number"
                            min="0"
                            disabled={!counterMeta.enabled}
                            value={dev.initial_counter}
                            onChange={(e) =>
                              updateWarrantyDevice(dev.uid, {
                                initial_counter: Math.max(0, parseInt(e.target.value || '0', 10) || 0),
                              })
                            }
                            className={`w-full h-9 px-2.5 bg-slate-900 border border-slate-700 rounded-md font-mono font-bold text-right text-white focus:border-sky-500 outline-none transition ${
                              !counterMeta.enabled ? 'opacity-45 cursor-not-allowed' : ''
                            }`}
                          />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Footer */}
            <div className="px-4 py-3 border-t border-slate-700 flex items-center justify-end gap-2">
              <button
                type="button"
                onClick={() => setWarrantyModalRecord(null)}
                className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold text-white transition"
              >
                Hủy
              </button>
              <button
                type="submit"
                disabled={isCreatingWarranty}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-lg transition disabled:opacity-50"
              >
                {isCreatingWarranty
				  ? 'Đang lưu...'
				  : isEditWarrantyMode
					? 'Lưu Thay Đổi Phiếu BH'
					: 'Lưu & Cấp Phiếu Bảo Hành'}
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ReceptionApp />);
</script>
{% endraw %}
{% endblock %}
